{% extends "layout.html" %}
{% block title %}Register — Study Hub{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="auth-card card shadow-sm">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <span class="auth-icon"><i class="bi bi-person-plus-fill"></i></span>
          <h1 class="h4 mt-3 fw-bold">Create an Account</h1>
          <p class="text-muted small">Join your study community</p>
        </div>

        <form id="register-form" method="post" action="{{ url_for('register') }}" novalidate>
          <div class="mb-3">
            <label for="username" class="form-label fw-medium">Username</label>
            <input type="text" class="form-control" id="username" name="username"
                   placeholder="e.g. studentharvard" autocomplete="username" required>
            <div class="invalid-feedback">Please enter a username.</div>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label fw-medium">Password</label>
            <input type="password" class="form-control" id="password" name="password"
                   placeholder="Min. 6 characters" autocomplete="new-password" required minlength="6">
            <div class="invalid-feedback">Password must be at least 6 characters.</div>
          </div>
          <div class="mb-4">
            <label for="confirmation" class="form-label fw-medium">Confirm Password</label>
            <input type="password" class="form-control" id="confirmation" name="confirmation"
                   placeholder="Repeat password" autocomplete="new-password" required>
            <div class="invalid-feedback" id="confirm-error">Passwords must match.</div>
          </div>
          <button type="submit" class="btn btn-primary w-100 fw-semibold">
            <i class="bi bi-person-check me-1"></i>Register
          </button>
        </form>

        <p class="text-center mt-3 small text-muted">
          Already have an account? <a href="{{ url_for('login') }}">Log in</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
