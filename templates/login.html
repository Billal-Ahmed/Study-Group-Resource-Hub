{% extends "layout.html" %}
{% block title %}Login — Study Hub{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="auth-card card shadow-sm">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <span class="auth-icon"><i class="bi bi-box-arrow-in-right"></i></span>
          <h1 class="h4 mt-3 fw-bold">Welcome Back</h1>
          <p class="text-muted small">Sign in to your Study Hub</p>
        </div>

        <form id="login-form" method="post" action="{{ url_for('login') }}" novalidate>
          <div class="mb-3">
            <label for="username" class="form-label fw-medium">Username</label>
            <input type="text" class="form-control" id="username" name="username"
                   placeholder="Your username" autocomplete="username" required>
            <div class="invalid-feedback">Username is required.</div>
          </div>
          <div class="mb-4">
            <label for="password" class="form-label fw-medium">Password</label>
            <input type="password" class="form-control" id="password" name="password"
                   placeholder="Your password" autocomplete="current-password" required>
            <div class="invalid-feedback">Password is required.</div>
          </div>
          <button type="submit" class="btn btn-primary w-100 fw-semibold">
            <i class="bi bi-box-arrow-in-right me-1"></i>Sign In
          </button>
        </form>

        <p class="text-center mt-3 small text-muted">
          New here? <a href="{{ url_for('register') }}">Create an account</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
